info:
  name: Create Category
  type: http
  seq: 3

http:
  method: POST
  url: http://localhost:3001/api/categories
  body:
    type: json
    data: |-
      {
        "ownerId": "owner-id-here",
        "name": "Groceries",
        "type": -1
      }
  auth: inherit

docs: |-
  type: -1 = расход (expense), 1 = доход (income)
