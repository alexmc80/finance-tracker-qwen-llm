version: '3.8'

services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: finance-tracker
    ports:
      - "3001:3001"
    volumes:
      - finance_data:/app/data
      - finance_logs:/app/backend/logs
    environment:
      - NODE_ENV=production
      - PORT=3001
      - DB_PATH=/app/data/finance.db
    restart: unless-stopped

volumes:
  finance_data:
    driver: local
  finance_logs:
    driver: local
